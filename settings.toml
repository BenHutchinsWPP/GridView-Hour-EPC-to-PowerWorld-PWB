# Settings for pcm_to_pf.py. Read by Scripts/settings.py.
# A setting left out keeps its default (the value in the Scripts/*.py file it belongs to). An unknown name is an error.

[run]
# "area": match each area's load, and each area's generation by type, by scaling what is in the seed PWB.
#         Topology isn't matched. Areas whose gens (or loads) have the same keys in both cases match unit by unit.
# "topology": make the seed match the GridView topology (missing elements, branch statuses), then match every
#         gen and load to its own EPC value.
mode = "area"
case_format = "PWB24"                   # PowerWorld Simulator 24 or later opens the saved cases.
# What pcm_to_pf.py runs with no arguments: step 01 "prepare" (skipped while Prepared/Prepared.pwb was made from these
# settings and seed: change the mode and it is redone), 02 "scale", 03 "merge". `python pcm_to_pf.py scale merge` runs only those.
steps = ["prepare", "scale", "merge"]
# Hours scaled at once in step 02, each in its own PowerWorld instance (one SimAuto license seat and the case's memory
# each). Each hour's console goes to Output/<hour>_Console.txt when above 1.
workers = 1

# Swing. true: add a giant swing generator (ID "xx") to take up the imbalance while scaling.
# false: use the case's own swing (the gens on its slack bus).
create_giant_swing = false
# Where the giant swing goes: "slack" (the case's slack bus), "max_fault_duty" (computes fault duty on every bus: slow),
# or a bus number.
swing_bus = "slack"
# Move MW off the swing onto the whole case's gen (load is never moved; one factor on every gen, so each area & GenType
# moves by the same share): during scaling whenever the swing is further than
# [area] balance_trigger_mw from 0, and after scaling until it is at its goal: the giant swing 0 MW; the case's own slack
# its EPC MW if its key is in the EPC, else anywhere within 0..MWMax (a negative MWMin
# still counts; a positive one doesn't). The swing unit itself is never moved.
balance_swing = true

# Seed preparation (step 01).
adjust_seed_shunts = true
gen_terminal_voltage_control = true     # Scripts/GenTerminalVoltageControl.aux
compute_pvqv = false                    # PVQV self-sensitivities (Prepared/pvqv.csv). Needed only for use_pvqv (step 02
                                        # stops with a message if use_pvqv is on without it: rerun step 01 with this on).

# Scaling (step 02).
# Two extra exclusions, off by default (bisecting the scaling step finds the gens/loads which diverge). Turn them on for a
# case which is hard to solve.
pretest_gens = false    # Test each gen target alone first, in parallel PowerWorld instances; exclude those which diverge.
use_pvqv = false        # Exclude gens/loads whose linear PVQV voltage change estimate is too large. Needs compute_pvqv.

[area]
# Unit commitment per area & GenType: bring gens online / take them offline to suit the target.
commit = true
commit_max_cf = 0.94                    # Match types: commit until the target is at most this of online MWMax.
# Capacity types: each area's group is one injection: every unit online, all at the same % of MWMax, matching the
# group's EPC total (each unit's own EPC MW is ignored). Every other type matches unit by unit (key basis), then scales.
capacity_types = ["Wind", "Solar", "Battery Storage"]
off_at_zero_types = ["Wind", "Solar", "Battery Storage"]   # At a target of 0, these go offline (other capacity types keep their status).
manual_unit_types = ["DC", "MP"]        # Unit types never scaled, in either case's totals (DC ties; MP motors / pumps, which are load).
# Non-conforming loads (load AGC = NO in PowerWorld, or flagged in the EPC): false = never scaled, and left out of both
# cases' area load totals; those whose key is in the EPC take its status and MW/Mvar 1:1, the rest keep their seed values.
# true = scaled like any other load.
scale_nonconforming = false
# Before scaling, the targets are balanced for the change in losses too: each area's losses (LossMW) are expected to go
# as (its target load / its seed load) ** loss_exponent. 2 = I^2 R; 0 = losses stay at their seed values. The areas
# sheet shows Seed, Est. and Final Loss MW, to check it by.
loss_exponent = 2.0
# Keep each area's gen total on target. In the plan: what an area & GenType's own units can't take (no units, or
# capped at MWMax) goes onto the area's other GenTypes. After the main scaling: what excluded/held units didn't reach
# goes onto the other units of their area & GenType, then the area's other gens (or their area's load), before the
# final balance. The areas sheet shows both as Make-up MW.
makeup = true
balance_tol_mw = 25.0
balance_max_rounds = 10
# While scaling, balance once the swing goes outside its band. The giant swing: further than balance_trigger_mw from 0
# (0 = not used), or (balance_at_swing_limits) past its MWMax / MWMin; with both, whichever comes first. The case's own
# slack: its band is where the plan expects it (moving from its start to its EPC MW as the scaling goes) +/-
# balance_trigger_mw, within 0 / MWMax, but at least +/- balance_trigger_mw / 2 around the point a balance aims
# at (so the band may reach past a narrow 0 / MWMax). With balance_trigger_mw 0 the band is [0, MWMax], and
# midrun balancing is off for the slack when that range is under 100 MW (MIN_OWN_RANGE_MW). Either way the step size is capped so one step can't carry the swing past
# its band (a slack ~2 GW off its plan can diverge).
balance_trigger_mw = 1000.0
balance_at_swing_limits = false
# Stop before scaling if more than this share of the EPC's generation (|MW|) has no GenType (its unit and fuel codes are
# blank or unknown): scaling would take the rest of the fleet offline. Map the codes below, or set 1.0 to turn this off.
max_unknown_share = 0.5
# Each hour's log gets a `shortfall` sheet: the EPC's and the PWB's gens side by side for every area & GenType whose own
# PWB units can't take at least this many MW of its EPC target (Unmet MW, before make-up). Flag 'no PWB units' marks a
# group the PWB has no units for at all (e.g. 1000 MW of EPC Wind in an area with no PWB wind).
shortfall_report_mw = 100.0
# A gen whose key (bus & ID) is in both cases takes the PWB's unit and fuel type in the EPC too, so both are classified
# the same way (the EPC's codes are often missing or wrong). false = each case keeps its own codes.
gen_types_from_pwb = true
# The GenTypes. Add one here to give it its own group, then map unit/fuel codes to it below.
gen_types = ["Solar", "Hydro", "Wind", "Thermal", "Battery Storage", "Unknown"]

# Overrides of the unit type -> GenType map in Scripts/area.py (UNIT_GENTYPE). "fuel" = decide by the fuel type.
[area.unit_gentype]
# PS = "Battery Storage"
# CP = "Battery Storage"

# Overrides of the fuel type -> GenType map (FUEL_GENTYPE), used when the unit type says "fuel".
[area.fuel_gentype]

[scale]
# Last-ditch solve aids. They change the network (in both modes), only to keep the case solving; every change is listed
# in the log's `exceptions` sheet for review. true / false.
add_statcoms = true         # Add a STATCOM (ID "SC") on the lowest-voltage bus below statcom_vpu.
drop_collapsed = true       # Open branches into network sections below collapse_vpu.
exclude_vmin = 0.88         # Hold gens/loads back from scaling while their bus is outside this band.
exclude_vmax = 1.12
statcom_vpu = 0.85
statcom_vnom_min = 50
collapse_vpu = 0.80
pvqv_dv_limit = 0.10
initial_step = 25           # In 1/100ths of the way to the target. Doubles after each step which solves...
max_step = 100              # ...up to this. Halves after each which diverges, down to 1, then bisects.
step_solves = 2
final_max_rounds = 20
# max_workers = 8           # PowerWorld instances for pretest_gens. Left out: the CPU count.

[prep]
swing_mw_max = 20000.0      # Giant swing MW limits (used by balance_at_swing_limits).
swing_mw_min = -20000.0
shunt_vlow = 0.92
shunt_vhigh = 1.08
shunt_max_iterations = 10

[topology]
tap_threshold = 0.15
unsupported_gv_branch_types = ["Breaker", "Disconnect", "Fuse", "Ground Disconnect", "Load Break Disconnect", "ZBR"]

[pw]
mva_mismatch_threshold = 1.0    # Max bus MVA mismatch for a solve to count as converged.
